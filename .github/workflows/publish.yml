name: Release package

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          case "$RELEASE_TYPE" in
            patch|minor|major) npm version "$RELEASE_TYPE" --no-git-tag-version ;;
            prepatch|preminor|premajor|prerelease) npm version "$RELEASE_TYPE" --preid=beta --no-git-tag-version ;;
            *) echo "Unsupported release type: $RELEASE_TYPE"; exit 1 ;;
          esac

      - name: Resolve release version
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME, package.json=$VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "npm-tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run release:check

      - name: Pack tested build
        run: npm pack --ignore-scripts

      - name: Commit and tag release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

      - name: Publish to NPM
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
        run: npm publish ./maveio-data-*.tgz --ignore-scripts --access public --tag "$NPM_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            maveio-data-*.tgz
